services:
  - type: web
    name: kristine-portfolio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: Kristine Portfolio
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://kristine-portfolio.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: kristine-portfolio-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: kristine-portfolio-db
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: PORTFOLIO_ADMIN_PIN
        sync: false

databases:
  - name: kristine-portfolio-db
    plan: free
